<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harlo Widget Installation Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f7f8;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid #dce5e8;
      border-radius: 8px;
      background: #ffffff;
    }

    .label {
      color: #087f95;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 0;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 14px 0 0;
      color: #64748b;
      font-size: 15px;
      line-height: 1.65;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e5eaec;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    .status-mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
    }
  </style>
  <script src="https://www.harloai.co/widget.js" data-harlo-organization="998a7d91-5f64-479a-a5c1-8b6ee69b3ebe" async></script>
</head>

<body>
  <main>
    <div class="label">Installation test</div>
    <h1>Harlo widget test page</h1>
    <p>
      Loading this page through an allowed public hostname confirms that the
      Harlo widget has been installed. You do not need to send a message.
    </p>
    <div class="status">
      <span class="status-mark"></span>
      The Harlo widget script is included on this page.
    </div>
  </main>

</body>

</html>
